version: '3.8'

services:
  opencode-go-proxy:
    build: .
    container_name: opencode-go-to-codex-api
    ports:
      - "${PORT:-30001}:30001"
    env_file:
      - .env
    environment:
      - PORT=30001
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://opencode.ai/zen/go}
      - OPENCODE_TOKEN=${OPENCODE_TOKEN:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - MODEL_MAP=${MODEL_MAP:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
